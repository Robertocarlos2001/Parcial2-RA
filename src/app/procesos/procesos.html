
<h1>Módulo de Procesos</h1>

<nav>
  <a routerLink="/inicio">Inicio</a> |
  <a routerLink="/procesos">Procesos</a> |
  <a routerLink="/reportes">Reportes</a>
</nav>

<hr>

<h2>Procesos disponibles</h2>

<ul>
  @for (elemento of elementos; track elemento.nombre) {
    <li>
      {{ elemento.nombre }}
      <a [routerLink]="['/proceso', elemento.nombre]">Ver proceso</a>
    </li>
  }
</ul>
